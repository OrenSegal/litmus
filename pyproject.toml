[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus-ci"
version = "0.2.0"
description = "Red/green regression tests for skills, prompts and tool definitions. A green only ever comes from a check that could have failed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oren Segal" }]
keywords = ["claude-code", "skills", "llm", "eval", "regression-testing", "prompt-engineering", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []  # engine is stdlib-only and dependency-free by design

[project.optional-dependencies]
yaml = ["pyyaml>=6"]   # optional: author cases in YAML instead of JSON
dev = ["pytest>=7", "coverage>=7", "ruff>=0.5", "mypy>=1.8", "build>=1"]

[project.urls]
Homepage = "https://github.com/OrenSegal/litmus"
Repository = "https://github.com/OrenSegal/litmus"
Issues = "https://github.com/OrenSegal/litmus/issues"
Changelog = "https://github.com/OrenSegal/litmus/blob/main/CHANGELOG.md"

[project.scripts]
litmus = "litmus.cli:main"

[tool.setuptools.packages.find]
include = ["litmus*"]

[tool.setuptools.package-data]
litmus = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["litmus"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["litmus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
