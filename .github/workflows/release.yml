name: release
# Build the sdist and wheel for a version tag and attach them to a GitHub
# Release. Nothing is published to PyPI or npm from here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches every manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python - "$tag" <<'EOF'
          import json, re, sys
          tag = sys.argv[1]
          from litmus import __version__
          found = {
              "litmus.__version__": __version__,
              "pyproject.toml": re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1),
              "package.json": json.load(open("package.json"))["version"],
              "plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              "marketplace.json": json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"],
          }
          bad = {k: v for k, v in found.items() if v != tag}
          if bad:
              sys.exit(f"tag v{tag} does not match: {bad}")
          EOF
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: |
          python -m pip install "build>=1" "twine>=5"
          python -m build
          twine check dist/*
      - name: Create the GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed. Built from $GITHUB_SHA."
