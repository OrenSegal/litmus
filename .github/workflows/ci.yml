name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, no deps)
        run: python -m unittest discover -s tests -t .
      - name: Demo mutation run from recordings (no model)
        run: python -m litmus.cli mutate examples/demo-plugin --replay-results examples/demo-recordings --allow-vacuous --min-score 0.5 --quiet --out "$RUNNER_TEMP/demo"
      - name: Plugin wrapper runs the same engine
        run: bin/litmus operators

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install "coverage>=7" "ruff==0.9.9" "mypy==1.11.2" "build>=1" "twine>=5"
      - name: Ruff
        run: ruff check litmus tests examples
      - name: Mypy (config in pyproject.toml)
        run: mypy
      - name: Coverage (floor in pyproject.toml)
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report
      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin, marketplace, commands and skills (strict)
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate commands --strict
          claude plugin validate skills --strict
          claude plugin validate examples/demo-plugin --strict
      - name: npm installer still copies the skill
        run: |
          node bin/install.js --dir "$RUNNER_TEMP/skill"
          test -f "$RUNNER_TEMP/skill/SKILL.md"
