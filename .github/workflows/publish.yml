name: publish
# Publish the sdist and wheel for a version tag to PyPI as litmus-ci, through
# PyPI trusted publishing (no token stored here). PyPI must list this repo,
# this workflow file (publish.yml) and the environment "pypi" as a trusted
# publisher first; until then this job fails and release.yml is unaffected.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/litmus-ci
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version="$(python -c 'import litmus; print(litmus.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME does not match litmus.__version__ $version"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: |
          python -m pip install "build>=1" "twine>=5"
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
