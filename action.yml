name: Litmus CI
description: Gate a Claude Code skill's golden tasks against a blessed baseline; fail the job on any regression.
author: Oren Segal
branding:
  icon: check-circle
  color: green

inputs:
  suite:
    description: Path to the suite directory (cases/, runs/, baseline.json).
    required: true
  baseline:
    description: Baseline JSON. Defaults to <suite>/baseline.json.
    required: false
    default: ""
  drift-tol:
    description: Allowed pass-rate drop before it counts as a regression.
    required: false
    default: "0.10"
  python-version:
    description: Python used to install and run Litmus.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    # Installs from the action's own checkout, so the version matches the ref in `uses:`.
    - name: Install Litmus
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: litmus gate
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        BASELINE: ${{ inputs.baseline }}
        DRIFT_TOL: ${{ inputs.drift-tol }}
      run: |
        args=(gate "$SUITE" --drift-tol "$DRIFT_TOL")
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        out="$RUNNER_TEMP/litmus-gate.txt"
        if litmus "${args[@]}" > "$out" 2>&1; then status=0; else status=$?; fi
        cat "$out"
        case $status in
          0) verdict="PASS: no regressions" ;;
          1) verdict="FAIL: regressions against the baseline" ;;
          2) verdict="ERROR: see output (no baseline yet? run \`litmus bless $SUITE\` and commit it)" ;;
          *) verdict="ERROR: litmus exited $status" ;;
        esac
        {
          echo "### Litmus gate: \`$SUITE\`"
          echo
          echo "**$verdict**"
          echo
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status
